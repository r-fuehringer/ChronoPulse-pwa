<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LilyGo ESP32 Timer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
</head>
<body>

  <div class="container">
    <h2>LilyGo Timer Control</h2>

    <!-- Bluetooth Connection Card -->
    <div class="card">
      <h3>1. Verbindung zum LilyGo</h3>
      <button id="connectBtn" onclick="connectESP32()">Mit LilyGo per Bluetooth verbinden</button>
      <p id="connStatus" class="status text-disconnected">Nicht verbunden</p>
    </div>

    <!-- Timer Config Card -->
    <div class="card">
      <h3>2. Timer Konfiguration</h3>
      
      <label for="modeSelect">Modus Wählen:</label>
      <select id="modeSelect" onchange="toggleFields()">
        <option value="COUNT_UP">1. Up-Timer (hh:mm:ss)</option>
        <option value="METCON">2. METCON (Countdown)</option>
        <option value="INTERVAL">3. Intervall</option>
      </select>

      <div id="metconFields" style="display:none;">
        <label for="metconDuration">Dauer (Sekunden):</label>
        <input type="number" id="metconDuration" value="600">
      </div>

      <div id="intervalFields" style="display:none;">
        <label for="workTime">Belastung (Sekunden):</label>
        <input type="number" id="workTime" value="40">
        <label for="restTime">Pause (Sekunden):</label>
        <input type="number" id="restTime" value="20">
        <label for="rounds">Runden:</label>
        <input type="number" id="rounds" value="8">
      </div>

      <button id="sendBtn" onclick="sendConfig()" disabled>Send Timer Config</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Service Worker für Offline/PWA Funktionalität registrieren
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("Service Worker registriert"))
        .catch(err => console.error("SW Fehler:", err));
    }
  </script>
</body>
</html>
